<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lorenz Attractor Extended</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div id="viewport-container">
		<div id="controls">
			<div class="system-controls">
				<div class="system-title s1-text">System 1 (Green)</div>
				<div class="control-group">
					<label>σ:</label> <input type="number" id="s1-sigma" value="10" step="0.1">
					<label>ρ:</label> <input type="number" id="s1-rho" value="28" step="0.1">
					<label>β:</label> <input type="number" id="s1-beta" value="2.6666"
						step="0.0001">
				</div>
				<div class="control-group initial-pos-group">
					<label title="Initial X">x₀:</label> <input type="number" id="s1-x" value="0.1"
						step="0.001">
					<label title="Initial Y">y₀:</label> <input type="number" id="s1-y" value="0"
						step="0.001">
					<label title="Initial Z">z₀:</label> <input type="number" id="s1-z" value="0"
						step="0.001">
				</div>
			</div>

			<div class="system-controls">
				<div class="system-title s2-text">System 2 (Red)</div>
				<div class="control-group">
					<label>σ:</label> <input type="number" id="s2-sigma" value="10" step="0.1">
					<label>ρ:</label> <input type="number" id="s2-rho" value="28" step="0.1">
					<label>β:</label> <input type="number" id="s2-beta" value="2.6666"
						step="0.0001">
				</div>
				<div class="control-group initial-pos-group">
					<label title="Initial X">x₀:</label> <input type="number" id="s2-x"
						value="0.101" step="0.001">
					<label title="Initial Y">y₀:</label> <input type="number" id="s2-y" value="0"
						step="0.001">
					<label title="Initial Z">z₀:</label> <input type="number" id="s2-z" value="0"
						step="0.001">
				</div>
			</div>

			<div class="global-controls">
				<div class="control-group global-btn-group">
					<button id="btn-pause">Pause</button>
					<button id="btn-reset">Reset</button>
				</div>
				<div class="control-group">
					<button class="view-btn active" data-mode="single">Single</button>
					<button class="view-btn" data-mode="overlap">Overlap</button>
					<button class="view-btn" data-mode="side-by-side">Split</button>
				</div>
			</div>
		</div>

		<div id="container">
			<canvas id="lorenz"></canvas>
			<div class="legend" id="legend">
				<div class="legend-item">
					<div class="color-box s1-bg"></div> Attractor 1
				</div>
				<div class="legend-item">
					<div class="color-box s2-bg"></div> Attractor 2
				</div>
			</div>
		</div>

		<div id="data-display">
			<table>
				<thead>
					<tr>
						<th>System</th>
						<th>X</th>
						<th>Y</th>
						<th>Z</th>
						<th>T</th>
					</tr>
				</thead>
				<tbody>
					<tr id="row-s1">
						<td>
							<div class="color-box s1-bg"></div>System 1
						</td>
						<td class="val-x">0.000</td>
						<td class="val-y">0.000</td>
						<td class="val-z">0.000</td>
						<td class="val-t">0.000</td>
					</tr>
					<tr id="row-s2">
						<td>
							<div class="color-box s2-bg"></div>System 2
						</td>
						<td class="val-x">0.000</td>
						<td class="val-y">0.000</td>
						<td class="val-z">0.000</td>
						<td class="val-t">0.000</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>

	<div id="records-container">
		<h2>History Records</h2>
		<div class="records-wrapper">
			<div class="record-table-container">
				<h3 class="history-header s1-text">System 1</h3>
				<table class="record-table" id="table-records-s1">
					<thead>
						<tr>
							<th>T</th>
							<th>X</th>
							<th>Y</th>
							<th>Z</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</div>
			<div class="record-table-container">
				<h3 class="history-header s2-text">System 2</h3>
				<table class="record-table" id="table-records-s2">
					<thead>
						<tr>
							<th>T</th>
							<th>X</th>
							<th>Y</th>
							<th>Z</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</div>
		</div>
	</div>

	<script src="index.js"></script>
</body>

</html>
