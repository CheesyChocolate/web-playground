<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lorenz Attractor Extended</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div id="controls">
		<div class="system-controls">
			<div style="color: #50FF50; font-size: 0.8rem; margin-bottom: 5px;">System 1 (Green)</div>
			<div class="control-group">
				<label>σ:</label> <input type="number" id="s1-sigma" value="10" step="0.1">
				<label>ρ:</label> <input type="number" id="s1-rho" value="28" step="0.1">
				<label>β:</label> <input type="number" id="s1-beta" value="2.6666" step="0.0001">
			</div>
			<div class="control-group" style="margin-top: 5px;">
				<label title="Initial X">x₀:</label> <input type="number" id="s1-x" value="0.1"
					step="0.001">
				<label title="Initial Y">y₀:</label> <input type="number" id="s1-y" value="0"
					step="0.001">
				<label title="Initial Z">z₀:</label> <input type="number" id="s1-z" value="0"
					step="0.001">
			</div>
		</div>

		<div class="system-controls">
			<div style="color: #FF5050; font-size: 0.8rem; margin-bottom: 5px;">System 2 (Red)</div>
			<div class="control-group">
				<label>σ:</label> <input type="number" id="s2-sigma" value="10" step="0.1">
				<label>ρ:</label> <input type="number" id="s2-rho" value="28" step="0.1">
				<label>β:</label> <input type="number" id="s2-beta" value="2.6666" step="0.0001">
			</div>
			<div class="control-group" style="margin-top: 5px;">
				<label title="Initial X">x₀:</label> <input type="number" id="s2-x" value="0.101"
					step="0.001">
				<label title="Initial Y">y₀:</label> <input type="number" id="s2-y" value="0"
					step="0.001">
				<label title="Initial Z">z₀:</label> <input type="number" id="s2-z" value="0"
					step="0.001">
			</div>
		</div>

		<div class="global-controls">
			<div class="control-group" style="margin-bottom: 5px;">
				<button id="btn-pause">Pause</button>
				<button id="btn-reset">Reset</button>
			</div>
			<div class="control-group">
				<button class="view-btn active" data-mode="single">Single</button>
				<button class="view-btn" data-mode="overlap">Overlap</button>
				<button class="view-btn" data-mode="side-by-side">Split</button>
			</div>
		</div>
	</div>

	<div id="container">
		<canvas id="lorenz"></canvas>
		<div class="legend" id="legend">
			<div class="legend-item">
				<div class="color-box" style="background: #50FF50;"></div> Attractor 1
			</div>
			<div class="legend-item">
				<div class="color-box" style="background: #FF5050;"></div> Attractor 2
			</div>
		</div>
	</div>

	<script src="index.js"></script>
</body>

</html>
